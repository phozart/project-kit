  product_design: true
  platform_foundation: true
  architecture: true
  ux_ui: true
  marketing: false
  implementation: true
  qa_security: true
  release: true
  documentation: true

gates:
  mode: mixed
  overrides:
    gate_0_setup: manual
    gate_1_innovation: auto
    gate_2_product_design: manual
    gate_3_platform_foundation: manual
    gate_4_architecture: auto
    gate_5_ux_ui_design: auto
    gate_6_marketing: skip
    gate_7_implementation: auto
    gate_8_qa_security: auto
    gate_9_release: manual
    gate_10_documentation: auto

techstack:
  language: ""
  language_version: ""
  runtime: ""
  frontend:
    framework: ""
    styling: ""
    state: ""
    testing: ""
  backend:
    framework: ""
    orm: ""
    testing: ""
  data:
    database_primary: ""
    database_cache: ""
    message_queue: ""
    orchestrator: ""
    processing: ""
    storage_format: ""
  infrastructure:
    containerization: ""
    ci_cd: ""
    cloud: ""
    iac: ""
  auth:
    method: ""
    provider: ""
  api:
    style: ""
    doc_format: ""

commands:
  build: ""
  test: ""
  lint: ""
  format: ""
  dev: ""

workflow:
  current_phase: setup
  phases_completed: []
  current_gate: 0
  gates_passed: []

requirements:
  total: 0
  implemented: 0
  tested: 0

sprints:
  current: 0
  features_in_progress: []
  features_completed: []

context_management:
  # Session boundary enforcement
  session_per_task: true          # Recommend new session per task during BUILD
  session_per_stage: true         # Recommend new session per work package stage
  max_exchanges_per_session: 15   # Warn after this many exchanges in a single task

  # What to load per session type
  task_session_context:
    - task_brief                  # docs/sprints/tasks/TASK-XXX.md
    - implementation_thinking     # implementation-thinking skill (reference)
    - technology_skill            # relevant tech skill (reference)
    # NOT: other task briefs, previous task conversation, full architecture doc

  test_session_context:
    - work_package_brief          # docs/sprints/WP-XXX-brief.md
    - test_commands               # how to run the test suite
    # NOT: implementation conversation, task briefs, design docs

  review_session_context:
    - changed_files_list          # git diff --name-only for the work package
    - implementation_notes        # TASK-XXX-notes.md for each task in WP
    - review_checklist            # from qa-review skill
    # NOT: build conversation, test output (unless test failures exist)

  qa_session_context:
    - work_package_brief          # docs/sprints/WP-XXX-brief.md with acceptance criteria
    - task_briefs_edge_cases      # edge cases from task briefs
    - qa_checklist                # from qa-review skill
    # NOT: code review findings (resolved), build conversation
